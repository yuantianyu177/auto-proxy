name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Cargo package version; blank uses Cargo.toml (manual runs never publish)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      publish: ${{ steps.release.outputs.publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      bundle_name: ${{ steps.release.outputs.bundle_name }}
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        name: Validate version and release policy
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "auto-proxy") | .version')"
          if [[ -z "${cargo_version}" ]]; then
            echo "could not determine the auto-proxy package version" >&2
            exit 1
          fi
          source_commit="$(git rev-parse 'HEAD^{commit}')"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "release tag must be v<semver>, got ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "${source_commit}" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
              echo "release tags must point to a commit reachable from ${DEFAULT_BRANCH}" >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            publish=true
            bundle_name="ap-v${version}-release-bundle"
          else
            version="${REQUESTED_VERSION:-${cargo_version}}"
            publish=false
            bundle_name="ap-v${version}-dry-run-bundle"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "version must be valid semver, got ${version}" >&2
            exit 1
          fi
          if [[ "${version}" != "${cargo_version}" ]]; then
            echo "requested version ${version} does not match Cargo.toml ${cargo_version}" >&2
            exit 1
          fi

          version_without_build="${version%%+*}"
          if [[ "${version_without_build}" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          {
            printf 'version=%s\n' "${version}"
            printf 'commit_sha=%s\n' "${source_commit}"
            printf 'publish=%s\n' "${publish}"
            printf 'prerelease=%s\n' "${prerelease}"
            printf 'bundle_name=%s\n' "${bundle_name}"
          } >> "${GITHUB_OUTPUT}"

  quality:
    name: Validate release source
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      run_throughput: false
      enforce_throughput: false

  build-linux:
    name: Build ${{ matrix.target }}
    needs:
      - prepare
      - quality
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
      - name: Install cross
        run: cargo install cross --locked --version 0.2.5
      - name: Build release binary
        run: cross build --locked --release --target "${{ matrix.target }}"
      - name: Package target
        run: |
          bash scripts/package-release.sh \
            "${{ matrix.target }}" \
            "${{ needs.prepare.outputs.version }}" \
            "target/${{ matrix.target }}/release/ap" \
            dist
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-macos:
    name: Build ${{ matrix.target }}
    needs:
      - prepare
      - quality
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Apply ad-hoc code signature
        run: |
          binary="target/${{ matrix.target }}/release/ap"
          codesign --force --sign - --identifier dev.approxy.ap "${binary}"
          codesign --verify --strict --verbose=2 "${binary}"
          signature="$(codesign --display --verbose=4 "${binary}" 2>&1)"
          grep -Fqx 'Signature=adhoc' <<< "${signature}"
          grep -Fqx 'Identifier=dev.approxy.ap' <<< "${signature}"
          if grep -Fq 'Authority=' <<< "${signature}"; then
            echo "macOS release binaries must not use a trusted signing identity" >&2
            exit 1
          fi
      - name: Package target
        run: |
          bash scripts/package-release.sh \
            "${{ matrix.target }}" \
            "${{ needs.prepare.outputs.version }}" \
            "target/${{ matrix.target }}/release/ap" \
            dist
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  bundle:
    name: Generate and verify release bundle
    if: >-
      ${{
        !cancelled()
        && needs.prepare.result == 'success'
        && needs.build-linux.result == 'success'
        && needs.build-macos.result == 'success'
      }}
    needs:
      - prepare
      - build-linux
      - build-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download target packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Generate checksums and verify bundle
        run: |
          bash scripts/sha256sums.sh "${{ needs.prepare.outputs.version }}" dist
          bash scripts/verify-release-bundle.sh "${{ needs.prepare.outputs.version }}" dist
      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.prepare.outputs.bundle_name }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish GitHub release
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.bundle_name }}
          path: dist
      - name: Verify downloaded release bundle
        run: bash scripts/verify-release-bundle.sh "${{ needs.prepare.outputs.version }}" dist
      - name: Publish verified draft atomically
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash scripts/ci/publish-release.sh \
            "${{ github.ref_name }}" \
            "${{ needs.prepare.outputs.commit_sha }}" \
            dist \
            "${{ needs.prepare.outputs.prerelease }}"
