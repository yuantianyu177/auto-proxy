name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_throughput:
        description: Record gateway throughput against raw OpenSSH
        required: false
        default: false
        type: boolean
      enforce_throughput:
        description: Fail if gateway throughput is below 85% of raw OpenSSH
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      run_throughput:
        required: false
        default: false
        type: boolean
      enforce_throughput:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  static-analysis:
    name: Formatting and workflow scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh scripts/ci/*.sh; do
            bash -n "${script}"
          done
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh scripts/ci/*.sh
      - name: Validate GitHub Actions workflows
        env:
          GOTOOLCHAIN: local
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  quality:
    name: Test and Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ci-${{ runner.os }}-${{ runner.arch }}-
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets --all-features

  msrv:
    name: Minimum supported Rust 1.88 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: msrv-${{ runner.os }}-${{ runner.arch }}-1.88.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: msrv-${{ runner.os }}-${{ runner.arch }}-1.88.0-
      - name: Check all targets and features
        run: cargo +1.88.0 check --locked --all-targets --all-features

  isolated-sshd:
    name: Isolated sshd integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AP_CI_TEST_USER: ap_ci_tunnel
      AP_CI_NETNS: ap-ci-isolated
      AP_CI_HOST_VETH: apci-host0
      AP_CI_NS_VETH: apci-peer0
      AP_CI_HOST_ADDR: 192.0.2.1
      AP_CI_SSH_ADDR: 192.0.2.2
      AP_CI_SSH_PORT: "22222"
      AP_CI_FORWARDING_DENIED_SSH_PORT: "22223"
      AP_CI_LISTEN_DENIED_SSH_PORT: "22224"
      AP_CI_PASSWORD_SSH_PORT: "22225"
      AP_RUN_DIRECT_SSH_DEV_TEST: "1"
      AP_DIRECT_SSH_DEV_HOST: 192.0.2.2
      AP_DIRECT_SSH_DEV_PORT: "22222"
      AP_DIRECT_SSH_DEV_USER: ap_ci_tunnel
      AP_RUN_SSH_POLICY_TEST: "1"
      AP_SSH_POLICY_HOST: 192.0.2.2
      AP_SSH_POLICY_USER: ap_ci_tunnel
      AP_SSH_POLICY_PROBE_SSH_PORT: "22222"
      AP_SSH_POLICY_FORWARDING_DENIED_SSH_PORT: "22223"
      AP_SSH_POLICY_LISTEN_DENIED_SSH_PORT: "22224"
      AP_SSH_POLICY_FORWARDING_DENIED_PORT: "47101"
      AP_SSH_POLICY_LISTEN_DENIED_PORT: "47102"
      AP_SSH_POLICY_CONFLICT_PORT: "47103"
      AP_CI_UNUSED_PERMITTED_PORT: "47104"
      AP_RUN_THROUGHPUT_TEST: ${{ (inputs.run_throughput || inputs.enforce_throughput) && '1' || '0' }}
      AP_THROUGHPUT_SSH_HOST: 192.0.2.2
      AP_THROUGHPUT_SSH_PORT: "22222"
      AP_THROUGHPUT_SSH_USER: ap_ci_tunnel
      AP_ENFORCE_THROUGHPUT: ${{ inputs.enforce_throughput && '1' || '0' }}
      AP_RUN_OPENSSH_PASSWORD_TEST: "1"
      AP_TEST_SSH_PASSWORD_HOST: 192.0.2.2
      AP_TEST_SSH_PASSWORD_PORT: "22225"
      AP_TEST_SSH_PASSWORD_USER: ap_ci_tunnel
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: isolated-sshd-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: isolated-sshd-${{ runner.os }}-${{ runner.arch }}-
      - name: Install isolated sshd prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends \
            openssh-server iproute2 iptables openssl
      - name: Set up isolated sshd fixture
        run: bash scripts/ci/setup-isolated-sshd.sh
      - name: Test reverse-forward protocols and reconnection
        run: timeout --signal=TERM --kill-after=30s 8m cargo test --locked --test direct_ssh_dev -- --ignored --nocapture
      - name: Test sshd policy failures and cleanup
        run: timeout --signal=TERM --kill-after=30s 5m cargo test --locked --test sshd_policy_ci -- --ignored --nocapture
      - name: Test password-only OpenSSH AskPass
        run: timeout --signal=TERM --kill-after=30s 5m cargo test --locked --test openssh_password_linux -- --nocapture
      - name: Measure reverse-tunnel gateway throughput
        if: env.AP_RUN_THROUGHPUT_TEST == '1'
        run: timeout --signal=TERM --kill-after=30s 10m cargo test --locked --release --test throughput_ci -- --ignored --nocapture
      - name: Show isolated sshd diagnostics
        if: failure() && env.AP_CI_DIR != ''
        run: bash scripts/ci/show-isolated-sshd-diagnostics.sh
      - name: Remove isolated sshd fixture
        if: always() && env.AP_CI_DIR != ''
        run: bash scripts/ci/cleanup-isolated-sshd.sh
