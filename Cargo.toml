[package]
name = "auto-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Share local HTTP and SOCKS5 proxies with SSH-reachable hosts"
license = "MIT OR Apache-2.0"

[[bin]]
name = "ap"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
fs2 = "0.4"
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "server", "tokio"] }
libc = "0.2"
nix = { version = "0.30", features = ["fs", "process", "signal", "socket", "user"] }
rpassword = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.45", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
url = "2.5"
uuid = { version = "1.16", features = ["serde", "v4"] }
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3.7"

[dev-dependencies]
proptest = "1.7"
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
